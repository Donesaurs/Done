name: Feature
description: Plan a user-facing product increment
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What will become possible for the user?
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: Acceptance criteria
      description: List observable and testable behavior.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: learning
    attributes:
      label: Learning goal
      description: Which technical concept should this work deliberately practice?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Shared
        - API
        - Android
        - macOS
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options:
        - Small
        - Medium
        - Large - must be divided
    validations:
      required: true
