name: Learning goal
description: Track a technical topic connected to product work
title: "[Learning] "
labels:
  - learning
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What should be understood or practiced?
    validations:
      required: true
  - type: textarea
    id: product
    attributes:
      label: Product connection
      description: Which Done feature provides the real context for this topic?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence of learning
      description: What implementation, explanation, or test will demonstrate understanding?
    validations:
      required: true
